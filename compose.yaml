name: vinext-laravel-starter

services:
  caddy:
    image: caddy:2.11.4-alpine
    environment:
      API_UPSTREAM: "${API_UPSTREAM:-host.docker.internal:${API_PORT:-18000}}"
      REVERB_UPSTREAM: "${REVERB_UPSTREAM:-host.docker.internal:${REVERB_PORT:-19080}}"
      WEB_UPSTREAM: "${WEB_UPSTREAM:-host.docker.internal:${WEB_PORT:-13100}}"
    ports:
      - "${WEB_PUBLIC_PORT:-13000}:13000"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2019/config/"]
      interval: 2s
      timeout: 3s
      retries: 15

  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: starter
      POSTGRES_PASSWORD: starter
      POSTGRES_USER: starter
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starter -d starter"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7.4.11-alpine3.21
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  mailpit:
    image: axllent/mailpit:v1.31.0
    ports:
      - "${MAILPIT_SMTP_PORT:-11025}:1025"
      - "${MAILPIT_HTTP_PORT:-18025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
  redis-data:

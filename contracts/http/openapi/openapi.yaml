openapi: 3.1.0
info:
  title: Vinext Laravel Starter API
  version: 1.0.0
tags:
  - name: Auth
  - name: Identity
  - name: Administration
  - name: Infrastructure
  - name: Tasks
paths:
  /api/v1/admin/users:
    get:
      operationId: listAdminUsers
      description: Search and cursor-page through safe User identity and role metadata. Requires users.view.
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            format: int32
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserPage'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Access is forbidden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - Administration
  /api/v1/admin/users/{id}/role:
    patch:
      operationId: updateAdminUserRole
      description: Replace another User's canonical role. Requires users.manage.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Access is forbidden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                    format: int32
                  detail:
                    type: string
                  code:
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                unevaluatedProperties:
                  not: {}
        '422':
          description: Client error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
      tags:
        - Administration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdminUserRoleRequest'
  /api/v1/auth/capabilities:
    get:
      operationId: getAuthCapabilities
      description: Public authentication capabilities controlled by Laravel deployment configuration.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthCapabilities'
      tags:
        - Auth
  /api/v1/auth/email/verification-notification:
    post:
      operationId: resendEmailVerification
      description: Resend the email verification notification to the authenticated user.
      parameters: []
      responses:
        '202':
          description: The request has been accepted for processing, but processing has not yet completed.
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Client error
          headers:
            Retry-After:
              required: false
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - Auth
  /api/v1/auth/email/verify/{id}/{hash}:
    get:
      operationId: verifyEmail
      description: Verify the authenticated user's email through a temporary signed link and redirect to the SPA.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: hash
          in: path
          required: true
          schema:
            type: string
        - name: expires
          in: query
          required: false
          schema:
            type: integer
            format: int64
          explode: false
        - name: signature
          in: query
          required: false
          schema:
            type: string
          explode: false
      responses:
        '302':
          description: Redirection
          headers:
            location:
              required: true
              schema:
                type: string
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Access is forbidden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Client error
          headers:
            Retry-After:
              required: false
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - Auth
  /api/v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessage'
        '422':
          description: Client error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
        '429':
          description: Client error
          headers:
            Retry-After:
              required: false
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
  /api/v1/auth/login:
    post:
      operationId: login
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '422':
          description: Client error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
        '429':
          description: Client error
          headers:
            Retry-After:
              required: false
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /api/v1/auth/logout:
    post:
      operationId: logout
      parameters: []
      responses:
        '204':
          description: There is no content to send for this request, but the headers may be useful.
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - Auth
  /api/v1/auth/register:
    post:
      operationId: register
      description: Register a new user. Controlled by the registration feature flag.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
        '403':
          description: Access is forbidden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Client error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
        '429':
          description: Client error
          headers:
            Retry-After:
              required: false
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
  /api/v1/auth/reset-password:
    post:
      operationId: resetPassword
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessage'
        '422':
          description: Client error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
  /api/v1/auth/two-factor-challenge:
    post:
      operationId: completeTwoFactorChallenge
      parameters: []
      responses:
        '204':
          description: There is no content to send for this request, but the headers may be useful.
        '422':
          description: Client error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
        '429':
          description: Client error
          headers:
            Retry-After:
              required: false
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorChallengeRequest'
  /api/v1/auth/user:
    delete:
      operationId: deleteCurrentUser
      description: Permanently delete the authenticated User and resources owned only by that identity.
      parameters: []
      responses:
        '204':
          description: There is no content to send for this request, but the headers may be useful.
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                    format: int32
                  detail:
                    type: string
                  code:
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                unevaluatedProperties:
                  not: {}
        '422':
          description: Client error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteCurrentUserRequest'
  /api/v1/auth/user/confirm-password:
    post:
      operationId: confirmPassword
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Client error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPasswordRequest'
  /api/v1/auth/user/confirmed-password-status:
    get:
      operationId: getPasswordConfirmationStatus
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordConfirmationStatus'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - Auth
  /api/v1/auth/user/confirmed-two-factor-authentication:
    post:
      operationId: confirmTwoFactor
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Client error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
        '423':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessage'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmTwoFactorRequest'
  /api/v1/auth/user/password:
    put:
      operationId: updatePassword
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Client error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordRequest'
  /api/v1/auth/user/profile-information:
    put:
      operationId: updateProfile
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Client error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
  /api/v1/auth/user/two-factor-authentication:
    post:
      operationId: enableTwoFactor
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '423':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessage'
      tags:
        - Auth
    delete:
      operationId: disableTwoFactor
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '423':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessage'
      tags:
        - Auth
  /api/v1/auth/user/two-factor-qr-code:
    get:
      operationId: getTwoFactorQrCode
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorQrCode'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '423':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessage'
      tags:
        - Auth
  /api/v1/auth/user/two-factor-recovery-codes:
    get:
      operationId: getRecoveryCodes
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '423':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessage'
      tags:
        - Auth
    post:
      operationId: regenerateRecoveryCodes
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '423':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessage'
      tags:
        - Auth
  /api/v1/auth/user/two-factor-secret-key:
    get:
      operationId: getTwoFactorSecretKey
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  secretKey:
                    type: string
                required:
                  - secretKey
                unevaluatedProperties:
                  not: {}
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '423':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessage'
      tags:
        - Auth
  /api/v1/me:
    get:
      operationId: getMe
      description: Current authenticated identity with roles, permissions and verification state.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - Identity
  /api/v1/tasks:
    post:
      operationId: createTask
      description: Create a Task and queue its processing. Requires a verified email and an Idempotency-Key header; repeating the key with the same payload replays the first response, and a different payload returns 409 with code idempotency_key_reused.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      responses:
        '202':
          description: The request has been accepted for processing, but processing has not yet completed.
          headers:
            Location:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Access is forbidden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                    format: int32
                  detail:
                    type: string
                  code:
                    type: string
                required:
                  - type
                  - title
                  - status
                  - code
                unevaluatedProperties:
                  not: {}
        '422':
          description: Client error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
      tags:
        - Tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
    get:
      operationId: listTasks
      description: Cursor-paginated list of the authenticated user's Tasks, newest first.
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            format: int32
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Access is forbidden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - Tasks
  /api/v1/tasks/{id}:
    get:
      operationId: getTask
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          description: Access is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Access is forbidden.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - Tasks
  /sanctum/csrf-cookie:
    get:
      operationId: getCsrfCookie
      description: Issue the CSRF cookie required before state-changing requests.
      parameters: []
      responses:
        '204':
          description: There is no content to send for this request, but the headers may be useful.
      tags:
        - Infrastructure
components:
  schemas:
    AdminUser:
      type: object
      required:
        - id
        - name
        - email
        - email_verified
        - roles
        - created_at
      properties:
        id:
          type: string
          description: Opaque identifier. Clients must not infer meaning from its value.
        name:
          type: string
        email:
          type: string
        email_verified:
          type: boolean
        roles:
          type: array
          items:
            $ref: '#/components/schemas/AdminUserRole'
        created_at:
          type: string
          format: date-time
      unevaluatedProperties:
        not: {}
    AdminUserPage:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        meta:
          type: object
          properties:
            next_cursor:
              anyOf:
                - type: string
                - type: 'null'
            prev_cursor:
              anyOf:
                - type: string
                - type: 'null'
          required:
            - next_cursor
            - prev_cursor
          unevaluatedProperties:
            not: {}
      unevaluatedProperties:
        not: {}
    AdminUserRole:
      type: string
      enum:
        - member
        - admin
    AuthCapabilities:
      type: object
      required:
        - registration
      properties:
        registration:
          type: boolean
      unevaluatedProperties:
        not: {}
    ConfirmPasswordRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
      unevaluatedProperties:
        not: {}
      allOf:
        - type: object
          unevaluatedProperties: {}
    ConfirmTwoFactorRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
      unevaluatedProperties:
        not: {}
      allOf:
        - type: object
          unevaluatedProperties: {}
    CreateTaskRequest:
      type: object
      required:
        - input
      properties:
        input:
          type: string
          maxLength: 10000
      unevaluatedProperties:
        not: {}
      allOf:
        - type: object
          unevaluatedProperties: {}
    DeleteCurrentUserRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
      unevaluatedProperties:
        not: {}
      allOf:
        - type: object
          unevaluatedProperties: {}
    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
      unevaluatedProperties:
        not: {}
      allOf:
        - type: object
          unevaluatedProperties: {}
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
        password:
          type: string
        remember:
          type: boolean
      unevaluatedProperties:
        not: {}
      allOf:
        - type: object
          unevaluatedProperties: {}
    LoginResult:
      type: object
      required:
        - two_factor
      properties:
        two_factor:
          type: boolean
      unevaluatedProperties:
        not: {}
    Me:
      type: object
      required:
        - id
        - name
        - email
        - email_verified
        - two_factor_enabled
        - two_factor_confirmed
        - roles
        - permissions
      properties:
        id:

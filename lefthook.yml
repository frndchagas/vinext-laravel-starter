pre-commit:
  parallel: true
  commands:
    format:
      run: bun run format:check
    secrets:
      run: if command -v gitleaks >/dev/null 2>&1; then gitleaks protect --staged --redact; else echo "gitleaks not installed locally; CI enforces it"; fi

pre-push:
  commands:
    check:
      run: bun run check

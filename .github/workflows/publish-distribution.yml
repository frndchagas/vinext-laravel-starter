name: Publish distribution

on:
  release:
    types: [published]

permissions:
  actions: read
  contents: read

concurrency:
  group: publish-distribution
  cancel-in-progress: false

jobs:
  packagist:
    if: github.repository == 'frndchagas/vinext-laravel-starter' && github.event.release.prerelease == false
    environment: distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:2.10.2

      - name: Verify the release source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$SOURCE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          source_commit=$(git rev-parse "${SOURCE_TAG}^{commit}")
          test "$(git cat-file -t "$SOURCE_TAG")" = tag
          test "$(git rev-parse HEAD)" = "$source_commit"
          git fetch origin main
          git merge-base --is-ancestor "$source_commit" origin/main
          bash scripts/verify-main-ci.sh "$source_commit"
          printf 'commit=%s\n' "$source_commit" >> "$GITHUB_OUTPUT"

      - name: Verify the Packagist credential
        env:
          PACKAGIST_SAFE_TOKEN: ${{ secrets.PACKAGIST_SAFE_TOKEN }}
        run: test -n "$PACKAGIST_SAFE_TOKEN"

      - name: Build the Laravel-root distribution
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          SOURCE_TAG: ${{ github.event.release.tag_name }}
        run: bun run scripts/build-distribution.mjs "$RUNNER_TEMP/distribution"

      - name: Configure the distribution deploy key
        env:
          DISTRIBUTION_DEPLOY_KEY: ${{ secrets.DISTRIBUTION_DEPLOY_KEY }}
        run: |
          set -o pipefail
          test -n "$DISTRIBUTION_DEPLOY_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DISTRIBUTION_DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          curl --fail --silent --show-error https://api.github.com/meta \
            | jq -r '.ssh_keys[] | "github.com " + .' \
            > "$HOME/.ssh/known_hosts"

      - name: Publish the matching tag
        id: distribution
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          SOURCE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git clone git@github.com:frndchagas/vinext-laravel-starter-distribution.git "$RUNNER_TEMP/repository"
          cd "$RUNNER_TEMP/repository"
          git config user.name "vinext-laravel-starter release"
          git config user.email "actions@users.noreply.github.com"

          if git rev-parse --verify --quiet "refs/tags/${SOURCE_TAG}"; then
            distribution_commit=$(git rev-parse "${SOURCE_TAG}^{commit}")
            test "$(git show "${SOURCE_TAG}:.source-commit")" = "$SOURCE_COMMIT"
            test "$(git show "${SOURCE_TAG}:.source-tag")" = "$SOURCE_TAG"
            printf 'commit=%s\n' "$distribution_commit" >> "$GITHUB_OUTPUT"
            echo "${SOURCE_TAG} already maps to ${SOURCE_COMMIT}."
            exit 0
          fi

          bash "$GITHUB_WORKSPACE/scripts/sync-distribution.sh" \
            "$RUNNER_TEMP/distribution" \
            "$RUNNER_TEMP/repository"
          git add --all

          if ! git diff --cached --quiet; then
            git commit -m "Distribute ${SOURCE_TAG}"
          fi

          test "$(tr -d '\n' < .source-commit)" = "$SOURCE_COMMIT"
          test "$(tr -d '\n' < .source-tag)" = "$SOURCE_TAG"
          git tag --annotate "$SOURCE_TAG" --message "Distribute ${SOURCE_TAG}"
          git push --atomic origin main "$SOURCE_TAG"
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Update and verify Packagist
        env:
          DISTRIBUTION_COMMIT: ${{ steps.distribution.outputs.commit }}
          PACKAGIST_SAFE_TOKEN: ${{ secrets.PACKAGIST_SAFE_TOKEN }}
          SOURCE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/packagist-sync.mjs "$SOURCE_TAG" "$DISTRIBUTION_COMMIT"

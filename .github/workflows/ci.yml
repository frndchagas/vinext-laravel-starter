name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * *"
      timezone: America/Fortaleza
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      integration: ${{ steps.classify.outputs.integration }}
      e2e: ${{ steps.classify.outputs.e2e }}
      template: ${{ steps.classify.outputs.template }}
      distribution: ${{ steps.classify.outputs.distribution }}
      production: ${{ steps.classify.outputs.production }}
      breaking: ${{ steps.classify.outputs.breaking }}
      docker: ${{ steps.classify.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Test path classification
        run: >-
          bun test
          scripts/ci-changes.test.mjs
          scripts/ci-policy.test.mjs
          scripts/build-distribution.test.mjs
          scripts/contracts-check.test.mjs
          scripts/packagist-sync.test.mjs
          scripts/trivy-ignore.test.mjs
          scripts/verify-release-credentials.test.mjs

      - name: Select affected gates
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_FORCE_FULL: ${{ github.event_name != 'pull_request' }}
        run: bun run scripts/ci-changes.mjs

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.5"
          extensions: pdo_sqlite, pcntl
          coverage: none
          tools: composer:2.10.2

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}

      - run: bun ci
      - run: composer install --working-dir apps/api --no-interaction --prefer-dist

      - name: Lint workflows
        run: >-
          docker run --rm
          --volume "$PWD:/repo"
          --workdir /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color
          .github/workflows/ci.yml
          .github/workflows/publish-distribution.yml
          scripts/distribution/ci.yml

      - name: Lint shell scripts
        run: shellcheck --severity=warning scripts/*.sh

      - name: Dependency audit
        run: bun run audit

      - name: Prepare application key
        working-directory: apps/api
        run: cp .env.example .env && php artisan key:generate

      - name: Contracts drift
        run: bun run contracts:check

      - name: Quality gate
        run: bun run check

  integration:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.5"]
    services:
      postgres:
        image: postgres:17.11-alpine3.24
        env:
          POSTGRES_DB: starter
          POSTGRES_USER: starter
          POSTGRES_PASSWORD: starter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U starter -d starter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.10-alpine3.21
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: starter
      DB_USERNAME: starter
      DB_PASSWORD: starter
      CACHE_STORE: redis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, redis, pcntl
          coverage: none
          tools: composer:2.10.2

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}

      - run: composer install --working-dir apps/api --no-interaction --prefer-dist

      - name: Prepare application key
        working-directory: apps/api
        run: cp .env.example .env && php artisan key:generate

      - name: Migrations from scratch
        working-directory: apps/api
        run: php artisan migrate --force --env=testing

      - name: Feature suite against real services
        working-directory: apps/api
        run: php artisan test

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, redis, pcntl
          coverage: none
          tools: composer:2.10.2

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}

      - name: Cache Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package.json', 'bun.lock') }}

      - run: bun ci
      - run: composer install --working-dir apps/api --no-interaction --prefer-dist
      - run: bunx playwright install --with-deps chromium

      - name: Prepare application key
        working-directory: apps/api
        run: cp .env.example .env && php artisan key:generate

      - name: Start test infrastructure
        run: bun run infra:up

      - name: Migrate the browser database
        working-directory: apps/api
        run: php artisan migrate --seed --force

      - name: Start the development stack
        run: |
          TASK_SIMULATED_DELAY_MS=1500 bun run dev > "$RUNNER_TEMP/vinext-laravel-starter-dev.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/vinext-laravel-starter-dev.pid"

          for _ in {1..60}; do
            if curl --fail --silent http://127.0.0.1:13000/up > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          sed -n '1,240p' "$RUNNER_TEMP/vinext-laravel-starter-dev.log"
          exit 1

      - name: Browser flows
        run: bun run test:e2e

      - name: Show development logs on failure
        if: failure()
        run: sed -n '1,320p' "$RUNNER_TEMP/vinext-laravel-starter-dev.log"

      - name: Stop the development stack
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/vinext-laravel-starter-dev.pid"; then
            xargs kill < "$RUNNER_TEMP/vinext-laravel-starter-dev.pid" || true
          fi
          docker compose down

  template-smoke:
    needs: changes
    if: needs.changes.outputs.template == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, redis, pcntl
          coverage: none
          tools: composer:2.10.2

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache
          key: template-composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}

      - name: Fresh template
        run: bun run test:template

  distribution-smoke:
    needs: changes
    if: needs.changes.outputs.distribution == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, redis, pcntl
          coverage: none
          tools: composer:2.10.2

      - run: bun ci
      - run: composer install --working-dir apps/api --no-interaction --prefer-dist
      - run: bun run test:distribution

  production-smoke:
    needs: changes
    if: needs.changes.outputs.production == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Cache Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package.json', 'bun.lock') }}

      - run: bun ci
      - run: bunx playwright install --with-deps chromium

      - name: Production topology
        run: bun run test:production:browser

      - name: Scan PHP runtime image
        if: needs.changes.outputs.docker == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vinext-laravel-starter-api:smoke-${{ github.run_id }}-${{ github.run_attempt }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library

      - name: Scan Nginx runtime image
        if: needs.changes.outputs.docker == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vinext-laravel-starter-api-nginx:smoke-${{ github.run_id }}-${{ github.run_attempt }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library
          skip-setup-trivy: true

      - name: Scan Caddy runtime image
        if: needs.changes.outputs.docker == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vinext-laravel-starter-proxy:smoke-${{ github.run_id }}-${{ github.run_attempt }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library
          skip-setup-trivy: true

      - name: Scan Node runtime image
        if: needs.changes.outputs.docker == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vinext-laravel-starter-web:smoke-${{ github.run_id }}-${{ github.run_attempt }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library
          skip-setup-trivy: true

      - name: Scan Redis image
        if: needs.changes.outputs.docker == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vinext-laravel-starter-redis:smoke-${{ github.run_id }}-${{ github.run_attempt }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library
          skip-setup-trivy: true

      - name: Scan PostgreSQL OS packages
        if: needs.changes.outputs.docker == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vinext-laravel-starter-postgres:smoke-${{ github.run_id }}-${{ github.run_attempt }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os
          skip-setup-trivy: true

      - name: Scan PostgreSQL bundled binary
        if: needs.changes.outputs.docker == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vinext-laravel-starter-postgres:smoke-${{ github.run_id }}-${{ github.run_attempt }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: library
          trivyignores: .trivyignore.yaml
          skip-setup-trivy: true

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  breaking-changes:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.breaking == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          path: base
      - name: Detect breaking API changes
        uses: oasdiff/oasdiff-action/breaking@2649ebe137aeb72a95707671204e829f86e091fc # v0.1.13
        with:
          base: base/contracts/http/openapi/openapi.yaml
          revision: contracts/http/openapi/openapi.yaml
          fail-on-diff: true
          review: false
          github-token: ""

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  ci:
    if: always()
    needs:
      - changes
      - verify
      - integration
      - e2e
      - template-smoke
      - distribution-smoke
      - production-smoke
      - gitleaks
      - breaking-changes
      - dependency-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require the event-specific CI policy
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_NEEDS: ${{ toJson(needs) }}
        run: node scripts/ci-policy.mjs needs
